name: PR diagram

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-diagram-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_LENS_CLI: "@coldtea/pr-lens-cli@0.13.2"
      DATA_BRANCH: pr-diagrams
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the graph from git facts
        run: |
          mkdir -p "$RUNNER_TEMP/pr-diagram"
          echo '{"modelTokens": 0}' > "$RUNNER_TEMP/pr-diagram/timings.json"
          node scripts/timed.mjs graphMs "$RUNNER_TEMP/pr-diagram/timings.json" -- \
            node scripts/build-graph.mjs "$BASE_SHA" "$HEAD_SHA" "$PR_TITLE" "$RUNNER_TEMP/pr-diagram"

      - name: Install the PR Lens CLI
        run: node scripts/timed.mjs prLensInstallMs "$RUNNER_TEMP/pr-diagram/timings.json" -- npx --yes "$PR_LENS_CLI" --version

      - name: Validate against the PR Lens schema
        run: node scripts/timed.mjs validateMs "$RUNNER_TEMP/pr-diagram/timings.json" -- npx --yes "$PR_LENS_CLI" validate "$RUNNER_TEMP/pr-diagram/graph.json"

      - name: Render light and dark SVGs
        run: node scripts/timed.mjs renderMs "$RUNNER_TEMP/pr-diagram/timings.json" -- npx --yes "$PR_LENS_CLI" render "$RUNNER_TEMP/pr-diagram/graph.json" --theme both --out "$RUNNER_TEMP/pr-diagram/assets"

      - name: Install elkjs for the own renderer
        run: node scripts/timed.mjs elkInstallMs "$RUNNER_TEMP/pr-diagram/timings.json" -- npm ci --no-audit --no-fund

      - name: Draw the same facts with the own SVG renderer
        run: node scripts/timed.mjs ownSvgMs "$RUNNER_TEMP/pr-diagram/timings.json" -- node scripts/render-svg.mjs "$RUNNER_TEMP/pr-diagram"

      - name: Draw the same facts as Mermaid
        run: node scripts/timed.mjs mermaidMs "$RUNNER_TEMP/pr-diagram/timings.json" -- node scripts/build-mermaid.mjs "$RUNNER_TEMP/pr-diagram"

      - name: Publish the SVGs and timings to the data branch
        id: publish
        run: bash scripts/publish.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Post or update the diagram comment
        run: bash scripts/comment.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_URL: ${{ steps.publish.outputs.assets-url }}
